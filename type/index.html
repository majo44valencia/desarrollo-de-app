<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAJO CASIO</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .form-container { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 12px; margin-bottom: 4px; font-weight: bold; }
    input, select, button { padding: 6px 10px; font-size: 14px; }
    #resultado { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
  </style>
  <script src="script.js" defer></script>
</head>
<body>

  <h1>MAJO CASIO</h1>

  <div class="form-container">
    <div class="field">
      <label for="num1">Ingrese primer número</label>
      <input type="text" id="num1" placeholder="escriba">
    </div>

    <div class="field">
      <label for="operacion">Operación</label>
      <select id="operacion">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
    </div>

    <div class="field">
      <label for="num2">Ingrese segundo número</label>
      <input type="text" id="num2" placeholder="escriba">
    </div>

    <button id="btnCalcular" type="button">Calcular</button>
  </div>

  <div id="resultado">tan tan tannnnn resultado</div>

  <h3>Historial</h3>
  <ul id="historial"></ul>

</body>
</html>

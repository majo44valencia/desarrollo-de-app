<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>CREAR CUENTA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="register-content ion-padding">
  <div class="register-card">
    
    <h2>¡Únete a la carrera!</h2>
    <p class="subtitle">Selecciona tu perfil y completa tus datos</p>

    <form (ngSubmit)="onRegister()">
      
      <!-- Selector de Rol -->
      <ion-item lines="full" class="custom-item">
        <ion-label position="stacked">Tipo de Usuario</ion-label>
        <ion-select [(ngModel)]="role" name="role" interface="popover">
          <ion-select-option value="passenger">Pasajero (Cliente)</ion-select-option>
          <ion-select-option value="driver">Conductor</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item lines="full" class="custom-item">
        <ion-label position="floating">Nombre Completo</ion-label>
        <ion-input type="text" [(ngModel)]="name" name="name" required></ion-input>
      </ion-item>

      <ion-item lines="full" class="custom-item">
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input type="email" [(ngModel)]="email" name="email" required></ion-input>
      </ion-item>

      <ion-item lines="full" class="custom-item">
        <ion-label position="floating">Teléfono</ion-label>
        <ion-input type="tel" [(ngModel)]="phone" name="phone" required></ion-input>
      </ion-item>

      <ion-item lines="full" class="custom-item">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="password" name="password" required></ion-input>
      </ion-item>

      <!-- Campos extras si es conductor -->
      <div *ngIf="role === 'driver'" class="driver-fields">
        <ion-item lines="full" class="custom-item">
          <ion-label position="floating">Placa del Vehículo</ion-label>
          <ion-input type="text" [(ngModel)]="plate" name="plate"></ion-input>
        </ion-item>
        <ion-item lines="full" class="custom-item">
          <ion-label position="floating">Modelo/Marca del Vehículo</ion-label>
          <ion-input type="text" [(ngModel)]="vehicle_model" name="vehicle_model"></ion-input>
        </ion-item>
      </div>

      <div class="ion-margin-top">
        <ion-button expand="block" type="submit" [disabled]="loading" class="btn-register">
          {{ loading ? 'REGISTRANDO...' : 'CREAR MI CUENTA' }}
        </ion-button>
      </div>

    </form>
  </div>
</ion-content>

<ion-content [fullscreen]="true" class="auth">
  <div class="auth-wrap">
    <div class="pokeball-logo" aria-hidden="true"><span></span></div>
    <h1>Poké<b>Scan</b></h1>
    <p class="sub">Crea tu cuenta de entrenador</p>

    <form class="card" (ngSubmit)="registrar()">
      <h2>Registrarse</h2>

      <ion-input name="nombre" label="Nombre" labelPlacement="floating" fill="outline" autocomplete="name" [(ngModel)]="nombre" required>
        <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
      </ion-input>

      <ion-input name="email" type="email" label="Correo" labelPlacement="floating" fill="outline" autocomplete="email" [(ngModel)]="email" required>
        <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
      </ion-input>

      <ion-input
        name="password"
        type="password"
        label="Contraseña (mín. 6)"
        labelPlacement="floating"
        fill="outline"
        autocomplete="new-password"
        [(ngModel)]="password"
        required
      >
        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-input
        name="confirmar"
        type="password"
        label="Confirmar contraseña"
        labelPlacement="floating"
        fill="outline"
        autocomplete="new-password"
        [(ngModel)]="confirmar"
        required
      >
        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      @if (error()) {
        <ion-text color="danger"><p class="error">{{ error() }}</p></ion-text>
      }

      <ion-button type="submit" expand="block" shape="round" [disabled]="cargando()">
        @if (cargando()) { <ion-spinner name="crescent"></ion-spinner> } @else { Crear cuenta }
      </ion-button>

      <p class="switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </form>
  </div>
</ion-content>

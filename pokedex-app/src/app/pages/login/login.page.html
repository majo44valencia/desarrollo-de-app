<ion-content [fullscreen]="true" class="auth">
  <div class="auth-wrap">
    <div class="pokeball-logo" aria-hidden="true"><span></span></div>
    <h1>Poké<b>Scan</b></h1>
    <p class="sub">Escanea un Pokémon y descubre todo sobre él</p>

    <form class="card" (ngSubmit)="ingresar()">
      <h2>Iniciar sesión</h2>

      <ion-input
        name="email"
        type="email"
        label="Correo"
        labelPlacement="floating"
        fill="outline"
        autocomplete="email"
        [(ngModel)]="email"
        required
      >
        <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
      </ion-input>

      <ion-input
        name="password"
        type="password"
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
      >
        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      @if (error()) {
        <ion-text color="danger"><p class="error">{{ error() }}</p></ion-text>
      }

      <ion-button type="submit" expand="block" shape="round" [disabled]="cargando()">
        @if (cargando()) { <ion-spinner name="crescent"></ion-spinner> } @else { Ingresar }
      </ion-button>

      <p class="switch">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    </form>
  </div>
</ion-content>
